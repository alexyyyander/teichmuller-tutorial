name: Build and Deploy PDF Documents

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-latex:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-xetex texlive-lang-chinese texlive-fonts-recommended texlive-latex-extra texlive-fonts-extra fonts-noto-cjk

    - name: Compile Chinese version - Foundations
      working-directory: docs/tutorial/foundations
      run: |
        xelatex -interaction=nonstopmode foundations_intro.tex
        xelatex -interaction=nonstopmode foundations_intro.tex

    - name: Compile Chinese version - Advanced
      working-directory: docs/tutorial/advanced
      run: |
        xelatex -interaction=nonstopmode teichmuller_program.tex
        xelatex -interaction=nonstopmode teichmuller_program.tex

    - name: Upload PDF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pdf-documents
        path: |
          docs/tutorial/foundations/*.pdf
          docs/tutorial/advanced/*.pdf
        retention-days: 30

    - name: Prepare Pages site
      run: |
        mkdir -p _site
        cp docs/tutorial/foundations/*.pdf _site/
        cp docs/tutorial/advanced/*.pdf _site/
        cp docs/index.html _site/

    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-latex
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
