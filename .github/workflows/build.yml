name: Build PDF Documents

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/**'

jobs:
  build-latex:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra texlive-fonts-extra fonts-noto-cjk

    - name: Compile English version - Advanced
      working-directory: docs/tutorial/advanced
      run: |
        xelatex -interaction=nonstopmode -halt-on-error teichmuller_program_en.tex
        xelatex -interaction=nonstopmode -halt-on-error teichmuller_program_en.tex

    - name: Upload PDF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pdf-documents
        path: docs/tutorial/advanced/*.pdf
        retention-days: 30