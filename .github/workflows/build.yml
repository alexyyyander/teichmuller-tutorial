name: Build PDF Documents

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-latex:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile LaTeX document (Chinese version - Foundations)
      uses: xu-cheng/latex-action@v3
      with:
        root_file: foundations_intro.tex
        latexmk_use_xelatex: true
        working_directory: docs/tutorial/foundations
        args: -xelatex -interaction=nonstopmode -halt-on-error
        pre_compile: |
          # 安装中文字体支持
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
        env:
          # 设置TeX Live环境
          TEXINPUTS: ".:./:../:"
          
    - name: Compile LaTeX document (English version - Foundations)
      uses: xu-cheng/latex-action@v3
      with:
        root_file: foundations_intro_en.tex
        latexmk_use_xelatex: true
        working_directory: docs/tutorial/foundations
        args: -xelatex -interaction=nonstopmode -halt-on-error
        env:
          TEXINPUTS: ".:./:../:"

    - name: Compile LaTeX document (Chinese version - Advanced)
      uses: xu-cheng/latex-action@v3
      with:
        root_file: teichmuller_program.tex
        latexmk_use_xelatex: true
        working_directory: docs/tutorial/advanced
        args: -xelatex -interaction=nonstopmode -halt-on-error
        env:
          TEXINPUTS: ".:./:../:"

    - name: Compile LaTeX document (English version - Advanced)
      uses: xu-cheng/latex-action@v3
      with:
        root_file: teichmuller_program_en.tex
        latexmk_use_xelatex: true
        working_directory: docs/tutorial/advanced
        args: -xelatex -interaction=nonstopmode -halt-on-error
        env:
          TEXINPUTS: ".:./:../:"

    - name: Upload PDF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pdf-documents
        path: |
          docs/tutorial/foundations/*.pdf
          docs/tutorial/advanced/*.pdf
        retention-days: 30

    - name: Verify PDFs exist
      run: |
        echo "Checking PDF files..."
        ls -la docs/tutorial/foundations/*.pdf || echo "No PDFs in foundations"
        ls -la docs/tutorial/advanced/*.pdf || echo "No PDFs in advanced"
        
    - name: Create release if on main branch
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          docs/tutorial/foundations/*.pdf
          docs/tutorial/advanced/*.pdf
        tag_name: pdf-build-${{ github.run_number }}
        name: PDF Build ${{ github.run_number }}
        body: |
          Automated PDF build from commit ${{ github.sha }}
          
          **Files:**
          - foundations_intro.pdf - 入门导论（中文）
          - foundations_intro_en.pdf - Foundations Introduction (English)
          - teichmuller_program.pdf - 进一步推导（中文）
          - teichmuller_program_en.pdf - Advanced Development (English)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}